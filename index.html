<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPZ | DHAKA - Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FCD34D',
                        brandAccent: '#F59E0B',
                        brandDark: '#111827',
                        brandBg: '#FEF3C7',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50/80 text-gray-900 min-h-screen font-sans flex flex-col antialiased">

    <!-- Header Section -->
    <header class="bg-amber-300/90 backdrop-blur-md sticky top-0 z-50 border-b border-amber-400/40 shadow-sm py-4 px-4">
        <div class="max-w-5xl mx-auto flex flex-col items-center">
            
            <!-- Logo Header -->
            <div class="flex items-center space-x-3 mb-3">
                <div class="bg-black text-amber-300 font-display font-extrabold text-2xl px-3 py-1 rounded-xl shadow">
                    SIPZ
                </div>
                <div class="h-7 w-0.5 bg-black/80"></div>
                <div class="text-left">
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-wider text-black leading-none font-display">DHAKA</h1>
                    <p class="text-[10px] font-bold uppercase tracking-widest text-amber-900">Food & Drinks</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="w-full max-w-md relative mt-1">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Search chicken, burger, bubble tea, browniness..." 
                    class="w-full pl-10 pr-10 py-2.5 rounded-full bg-white border border-amber-400/60 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black shadow-sm text-sm font-medium"
                >
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-amber-700 text-sm"></i>
                <button id="clearSearch" class="hidden absolute right-3 top-2.5 text-gray-400 hover:text-gray-700 p-0.5">
                    <i class="fa-solid fa-circle-xmark text-base"></i>
                </button>
            </div>

            <!-- Category Tabs -->
            <div class="w-full max-w-2xl mt-4 overflow-x-auto no-scrollbar flex space-x-2 justify-start sm:justify-center px-1">
                <button onclick="filterCategory('all')" id="tab-all" class="cat-btn active bg-black text-amber-300 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow transition">
                    <i class="fa-solid fa-border-all mr-1.5"></i>All Menu
                </button>
                <button onclick="filterCategory('main')" id="tab-main" class="cat-btn bg-white hover:bg-amber-200 text-gray-800 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap border border-amber-300 shadow-sm transition">
                    <i class="fa-solid fa-burger mr-1.5"></i>Main Course
                </button>
                <button onclick="filterCategory('drinks')" id="tab-drinks" class="cat-btn bg-white hover:bg-amber-200 text-gray-800 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap border border-amber-300 shadow-sm transition">
                    <i class="fa-solid fa-wine-glass mr-1.5"></i>Drinks (Iced)
                </button>
                <button onclick="filterCategory('dessert')" id="tab-dessert" class="cat-btn bg-white hover:bg-amber-200 text-gray-800 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap border border-amber-300 shadow-sm transition">
                    <i class="fa-solid fa-cookie-bite mr-1.5"></i>Dessert
                </button>
                <button onclick="filterCategory('addons')" id="tab-addons" class="cat-btn bg-white hover:bg-amber-200 text-gray-800 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap border border-amber-300 shadow-sm transition">
                    <i class="fa-solid fa-plus-circle mr-1.5"></i>Add One
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">

        <div id="noResults" class="hidden text-center py-16">
            <i class="fa-solid fa-utensils text-4xl text-amber-400 mb-3"></i>
            <h3 class="text-base font-bold text-gray-800">No items match your search</h3>
            <p class="text-xs text-gray-500 mt-1">Try typing another food item or drink name.</p>
        </div>

        <div id="menuContainer" class="space-y-10">

            <!-- MAIN COURSE -->
            <section id="sec-main" class="menu-sec">
                <div class="flex items-center justify-between border-b-2 border-amber-400/80 pb-2 mb-4">
                    <h2 class="text-xl font-extrabold text-black font-display tracking-wide uppercase flex items-center">
                        <span class="w-3 h-6 bg-black rounded-sm mr-2.5"></span>Main Course
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="grid-main"></div>
            </section>

            <!-- DRINKS -->
            <section id="sec-drinks" class="menu-sec">
                <div class="flex items-center justify-between border-b-2 border-amber-400/80 pb-2 mb-4">
                    <h2 class="text-xl font-extrabold text-black font-display tracking-wide uppercase flex items-center">
                        <span class="w-3 h-6 bg-black rounded-sm mr-2.5"></span>Drinks (Iced)
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="grid-drinks"></div>
            </section>

            <!-- DESSERT -->
            <section id="sec-dessert" class="menu-sec">
                <div class="flex items-center justify-between border-b-2 border-amber-400/80 pb-2 mb-4">
                    <h2 class="text-xl font-extrabold text-black font-display tracking-wide uppercase flex items-center">
                        <span class="w-3 h-6 bg-black rounded-sm mr-2.5"></span>Dessert
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="grid-dessert"></div>
            </section>

            <!-- ADD ONE -->
            <section id="sec-addons" class="menu-sec">
                <div class="flex items-center justify-between border-b-2 border-amber-400/80 pb-2 mb-4">
                    <h2 class="text-xl font-extrabold text-black font-display tracking-wide uppercase flex items-center">
                        <span class="w-3 h-6 bg-black rounded-sm mr-2.5"></span>Add One
                    </h2>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="grid-addons"></div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-amber-300 py-6 px-4 text-center mt-12 border-t border-amber-500/30">
        <p class="font-display font-bold tracking-widest text-lg">SIPZ | DHAKA</p>
        <p class="text-xs text-amber-200/70 mt-1">Original Digital Menu Card &copy; SIPZ Dhaka</p>
    </footer>

    <script>
        const menuData = {
            main: [
                { name: 'Chicken Club Sandwich', desc: 'Chicken, Cheese, Lettuce, Sauce with Fries', price: 260, img: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80' },
                { name: 'Chicken Cheese Burger', desc: 'Juicy Chicken patty, onion, cabbage, cheese', price: 265, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80' },
                { name: 'Crispy Chicken Burger', desc: 'Crispy Chicken, Sauce, lettuce', price: 235, img: 'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80' },
                { name: 'Spicy Beef Ramen', desc: 'Ramen, Beef Becon, Egg, Green Onions', price: 279, img: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=80' },
                { name: 'Sweet & Spicy Wings', desc: 'Crispy wings tossed in signature sweet spicy glaze', price: 220, img: 'https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=500&q=80' },
                { name: 'Boneless Fried Chicken', desc: 'Golden fried tender boneless chicken', price: 135, img: 'https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=500&q=80' },
                { name: 'Katsu Chicken Bowl', desc: 'Katsu Chicken, Egg With Rice', price: 239, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80' },
                { name: 'Crispy Chicken Wings', desc: 'Classic crispy deep fried chicken wings', price: 199, img: 'https://images.unsplash.com/photo-1567620832903-9fc6debc209f?auto=format&fit=crop&w=500&q=80' },
                { name: 'French Fries', desc: 'Crispy golden potato fries', price: 150, img: 'https://images.unsplash.com/photo-1576107232684-1279f3908594?auto=format&fit=crop&w=500&q=80' },
                { name: 'Mexican Grilled Chicken Bowl', desc: 'Mexican Style Rice, Grilled Chicken, Sweetcorn, Mashroom, & Sour Cream', price: 289, img: 'https://images.unsplash.com/photo-1543339308-43e59d6b73a6?auto=format&fit=crop&w=500&q=80' }
            ],
            drinks: [
                { name: 'Taro Bubble Milk Tea', desc: 'Sweet taro milk tea with tapioca boba pearls', price: 239, img: 'https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=500&q=80' },
                { name: 'Coconut Bubble Milk Tea', desc: 'Tropical iced coconut tea with chewy boba', price: 239, img: 'https://images.unsplash.com/photo-1525385133512-2f3bdd039054?auto=format&fit=crop&w=500&q=80' },
                { name: 'Mango Mojito Tea', desc: 'Refreshing mango tea with fresh mint & lime', price: 239, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80' },
                { name: 'Passion Fruit Mojito Tea', desc: 'Zesty passion fruit tea infused with mint', price: 239, img: 'https://images.unsplash.com/photo-1621263764928-df1444c5e859?auto=format&fit=crop&w=500&q=80' },
                { name: 'Mint Lemonade', desc: 'Chilled iced fresh lemon & mint cooler', price: 149, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80' },
                { name: 'Orange Squash', desc: 'Refreshing citrus orange mocktail', price: 159, img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=500&q=80' },
                { name: 'Cold Coffee With Choco Chips', desc: 'Rich cold coffee topped with choco chips', price: 149, img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=500&q=80' },
                { name: 'Lemon Water', desc: 'Simple refreshing citrus lemon water', price: 80, img: 'https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9e?auto=format&fit=crop&w=500&q=80' }
            ],
            dessert: [
                { name: 'Chocolate Brownie', desc: 'Dense chocolate fudge baked brownie', price: 120, img: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=500&q=80' },
                { name: 'Chocolate Cookies', desc: 'Crispy & chewy chocolate chip cookies', price: 50, img: 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=500&q=80' },
                { name: 'Chocho Fudge', desc: 'Rich velvety chocolate fudge dessert', price: 180, img: 'https://images.unsplash.com/photo-1579372786545-d24232daf58c?auto=format&fit=crop&w=500&q=80' }
            ],
            addons: [
                { name: 'Extra Garlic Sauce', price: 25 },
                { name: 'Extra Hot Sauce', price: 30 },
                { name: 'Extra Boba', price: 30 },
                { name: 'Extra Flavour', price: 40 },
                { name: 'Extra mozzarella', price: 30 },
                { name: 'Extra Egg', price: 20 },
                { name: 'Extra Slice Cheese', price: 30 }
            ]
        };

        function makeItemCard(item) {
            return `
                <div class="item-card bg-white rounded-xl overflow-hidden border border-amber-200/80 shadow-sm flex flex-col justify-between hover:border-amber-400 transition" data-name="${item.name.toLowerCase()}" data-desc="${(item.desc || '').toLowerCase()}">
                    <div class="flex p-3 space-x-3 items-center">
                        <img src="${item.img}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg flex-shrink-0 bg-amber-100" onerror="this.src='https://placehold.co/200x200/fcd34d/000000?text=SIPZ';">
                        <div class="flex-grow">
                            <h3 class="font-bold text-gray-900 text-sm leading-snug">${item.name}</h3>
                            ${item.desc ? `<p class="text-[11px] text-gray-500 mt-1 leading-tight">${item.desc}</p>` : ''}
                            <div class="mt-2 text-amber-700 font-extrabold text-sm">${item.price} <span class="text-[10px] font-bold">BDT</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function makeAddonCard(addon) {
            return `
                <div class="item-card bg-white p-3 rounded-lg border border-amber-200 shadow-sm text-center flex flex-col justify-between" data-name="${addon.name.toLowerCase()}">
                    <p class="font-bold text-xs text-gray-800">${addon.name}</p>
                    <p class="text-xs font-black text-amber-700 mt-1">${addon.price} BDT</p>
                </div>
            `;
        }

        function render() {
            document.getElementById('grid-main').innerHTML = menuData.main.map(makeItemCard).join('');
            document.getElementById('grid-drinks').innerHTML = menuData.drinks.map(makeItemCard).join('');
            document.getElementById('grid-dessert').innerHTML = menuData.dessert.map(makeItemCard).join('');
            document.getElementById('grid-addons').innerHTML = menuData.addons.map(makeAddonCard).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-amber-300');
                btn.classList.add('bg-white', 'text-gray-800');
            });
            const activeBtn = document.getElementById(`tab-${cat}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-gray-800');
                activeBtn.classList.add('bg-black', 'text-amber-300');
            }

            const secs = {
                'main': document.getElementById('sec-main'),
                'drinks': document.getElementById('sec-drinks'),
                'dessert': document.getElementById('sec-dessert'),
                'addons': document.getElementById('sec-addons')
            };

            if(cat === 'all') {
                Object.values(secs).forEach(s => s.classList.remove('hidden'));
            } else {
                Object.keys(secs).forEach(k => {
                    if(k === cat) secs[k].classList.remove('hidden');
                    else secs[k].classList.add('hidden');
                });
            }
            filterSearch();
        }

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        const noRes = document.getElementById('noResults');

        function filterSearch() {
            const q = searchInput.value.trim().toLowerCase();
            let count = 0;
            if(q) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            document.querySelectorAll('.item-card').forEach(card => {
                const name = card.getAttribute('data-name') || '';
                const desc = card.getAttribute('data-desc') || '';
                const sec = card.closest('.menu-sec');

                if(!sec.classList.contains('hidden') && (name.includes(q) || desc.includes(q))) {
                    card.classList.remove('hidden');
                    count++;
                } else {
                    card.classList.add('hidden');
                }
            });

            if(count === 0) noRes.classList.remove('hidden');
            else noRes.classList.add('hidden');
        }

        searchInput.addEventListener('input', filterSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterSearch();
        });

        window.onload = render;
    </script>
</body>
</html>
